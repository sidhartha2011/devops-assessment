apiVersion: apps/v1
kind: Deployment
metadata:
  name: vexar-fleet-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vexar-fleet-service
  template:
    metadata:
      labels:
        app: vexar-fleet-service
    spec:
      containers:
        - name: vexar-fleet-service
          image: vexar-fleet-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: vexar-config
            - secretRef:
                name: vexar-secret

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"